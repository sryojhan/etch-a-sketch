<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch a sketch</title>


    <link rel="stylesheet" href="style.css">
</head>

<body>



    <div class="page">

        <div class="content">

            <div class="shake-container">

                <div class="outer-shell">


                    <div class="screen">

                        <div class="container" id="sketch">

                        </div>

                        <div class="inner-shadow">


                        </div>

                    </div>


                    <div class="wheel-container">

                        <div class="wheel" id="left-wheel">
                            <div class="wheel-content"></div>
                        </div>

                        <div class="wheel" id="right-wheel">
                            <div class="wheel-content"></div>
                        </div>
                    </div>

                </div>


            </div>


        </div>

        <div class="info">

            <h1>Etch-a-sketch: made by Yojhan</h1>


            <h3>
                Pad thickness: <input type="range" min="100" max="400" value="50" class="slider" id="thickness">
            </h3>


            <h3>
                Keyboard speed: <input type="range" min="1" max="10" value="4" class="slider" id="keyboard-speed">
            </h3>


            <button id="clearBtn"> Clear pad</button>
        </div>



    </div>
    <script src="script.js"></script>
</body>

</html>
