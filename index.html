<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch a sketch</title>


    <link rel="stylesheet" href="style.css">
</head>
<body>
    


    <div class="page">

        <div class="content">

            <div class="outer-shell" oncontextmenu="return false">
            
                <div class="screen" id="sketch">
                    

                    
                </div>
                
            </div>

            <div class="wheel-container">

                <div class="wheel" id="left-wheel">
                    <div class="wheel-content"></div>
                </div>

                <div class="wheel" id="right-wheel">
                    <div class="wheel-content"></div>
                </div>
            </div>

        </div>

        <div class="info">

            <h1>Etch-a-sketch</h1>

            <p>Yojhan</p>

            <h3>
                Pad thickness: <input type="range" min="100" max="400" value="50" class="slider" id="thickness">
            </h3>

            <button> Clear pad</button>
        </div>
        


    </div>
        
    <script src="script.js"></script>
</body>
</html>
